<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Pro — Connexion</title>
  <link rel="icon" href="/erp/public/assets/images/logo.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#EF4444', dark: '#DC2626' },
            accent:  { DEFAULT: '#F97316' }
          },
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Inter','Segoe UI','sans-serif'] }
        }
      }
    }
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .input-field { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: white; }
    .input-field:focus { outline: none; border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .input-field::placeholder { color: rgba(255,255,255,0.35); }
    .btn-primary { background: linear-gradient(135deg, #EF4444, #F97316); }
    .btn-primary:hover { background: linear-gradient(135deg, #DC2626, #EA580C); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(239,68,68,0.4); }
    .floating { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
  </style>
</head>
<body class="h-full gradient-bg flex items-center justify-center min-h-screen overflow-hidden" x-data="loginApp()">

  <!-- Background decoration -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-red-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-orange-500/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/5 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md px-6">
    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl btn-primary mb-4 floating">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">ERP <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400">Pro</span></h1>
      <p class="text-slate-400 mt-1 text-sm">Plateforme de gestion d'entreprise</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-3xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6">Connexion</h2>

      <template x-if="error">
        <div class="mb-4 p-3 rounded-xl bg-red-500/15 border border-red-500/30 flex items-center gap-3">
          <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <p class="text-red-300 text-sm" x-text="error"></p>
        </div>
      </template>

      <form @submit.prevent="login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
            </div>
            <input type="email" x-model="form.email" required
                   class="input-field w-full pl-10 pr-4 py-3 rounded-xl text-sm transition-all duration-200"
                   placeholder="admin@erppro.ma" autocomplete="email" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input :type="showPwd ? 'text' : 'password'" x-model="form.password" required
                   class="input-field w-full pl-10 pr-12 py-3 rounded-xl text-sm transition-all duration-200"
                   placeholder="••••••••" autocomplete="current-password" />
            <button type="button" @click="showPwd = !showPwd"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200">
              <svg x-show="!showPwd" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg x-show="showPwd" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" x-model="form.remember" class="w-4 h-4 rounded border-slate-600 bg-slate-700 accent-red-500" />
            <span class="text-sm text-slate-400">Se souvenir</span>
          </label>
          <a href="#" class="text-sm text-red-400 hover:text-red-300 transition-colors">Mot de passe oublié ?</a>
        </div>

        <button type="submit" :disabled="loading"
                class="btn-primary w-full py-3 px-4 rounded-xl text-white font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
          <svg x-show="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span x-text="loading ? 'Connexion...' : 'Se connecter'"></span>
        </button>
      </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6">
      ERP Pro v1.0 &bull; Tous droits réservés &copy; 2024
    </p>
  </div>

  <script>
    function loginApp() {
      return {
        form: { email: '', password: '', remember: false },
        loading: false,
        error: null,
        showPwd: false,

        async login() {
          this.loading = true;
          this.error   = null;
          try {
            const res = await fetch('/erp/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Erreur de connexion');
            localStorage.setItem('erp_token',   data.data.access_token);
            localStorage.setItem('erp_refresh',  data.data.refresh_token);
            localStorage.setItem('erp_user',     JSON.stringify(data.data.user));
            window.location.href = '/erp/public/index.html';
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
